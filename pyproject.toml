[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = []

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = [
  "mcp_server/tests",
  "flask_web/tests"
]
# Keep asyncio support enabled while Quart remains as a legacy transition surface.
asyncio_mode = "auto"
addopts = "-q"
