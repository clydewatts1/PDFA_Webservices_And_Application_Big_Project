<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}PDFA Workflow Manager{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        canvas: "#F8F9FA",
                        surface: "#FFFFFF",
                        primary: "#1A73E8",
                        divider: "#DADCE0",
                        ink: "#202124",
                        muted: "#5F6368",
                        success: "#1967D2",
                        danger: "#C5221F",
                    },
                    fontFamily: {
                        sans: ["Inter", "Product Sans", "Segoe UI", "Helvetica Neue", "Arial", "sans-serif"],
                    },
                    boxShadow: {
                        google: "0 1px 2px 0 rgba(60,64,67,.30), 0 1px 3px 1px rgba(60,64,67,.15)",
                        raised: "0 2px 8px rgba(60,64,67,.18)",
                    },
                    borderRadius: {
                        google: "0.5rem",
                    },
                },
            },
        };
    </script>
    <style>
        .clamp-2 {
            display: -webkit-box;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
            overflow: hidden;
        }

        [data-toast][hidden] {
            display: none;
        }
    </style>
</head>
<body class="min-h-screen bg-canvas font-sans text-ink antialiased">
    {% block body %}
        <main>
            {% block content %}{% endblock %}
        </main>
    {% endblock %}

    <div class="pointer-events-none fixed bottom-6 left-6 z-[80] flex w-[min(28rem,calc(100vw-3rem))] flex-col gap-3">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <section
                        data-toast
                        class="pointer-events-auto rounded-google border bg-surface px-4 py-3 text-sm shadow-google {% if category == 'error' %}border-danger/20 text-danger{% else %}border-primary/20 text-primary{% endif %}"
                    >
                        {{ message }}
                    </section>
                {% endfor %}
            {% endif %}
        {% endwith %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@hpcc-js/wasm@2/dist/graphviz.umd.js" type="application/javascript"></script>
    <script>
        // d3-graphviz expects `window.hpccWasm`; UMD may expose `window["@hpcc-js/wasm"]`.
        window.hpccWasm = window.hpccWasm || window["@hpcc-js/wasm"];
    </script>
    <script src="https://cdn.jsdelivr.net/npm/d3@7/dist/d3.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/d3-graphviz@5/build/d3-graphviz.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
